# VerifierGate — centralised deployment security gate.
#
# Design notes:
#   * `permissions` is scoped to read-only contents. Nothing in this pipeline
#     needs write access, so no write scope is granted at all.
#   * Third-party actions are pinned to a full commit SHA, not a tag. A mutable
#     tag such as `@v4` can be repointed at new code by anyone who compromises
#     the upstream repository; a SHA cannot.
#   * `persist-credentials: false` stops the checkout token from being written
#     into .git/config where a later step could exfiltrate it.
#   * gate.py exits 2 to block a deployment, which fails this job by design.

name: VerifierGate Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a stale push cannot report success.
concurrency:
  group: verifergate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-gate:
    name: Correlate, policy check, verify provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The secret scanner walks git history, not just the working tree, so
          # a shallow clone would silently hide every historical leak.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      # VerifierGate is standard-library only, so there is nothing to install.
      # The install step is kept as a dependency audit rather than a setup step.
      - name: Audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Pinned: an unpinned audit tool is itself an unpinned supply-chain
          # dependency in the job that is supposed to be checking for those.
          pip install "pip-audit==2.10.1"

          # No third-party runtime dependencies are declared, so there is
          # nothing to audit until requirements.txt gains a real entry.
          if grep -qE '^[[:space:]]*[^#[:space:]]' requirements.txt; then
            pip-audit -r requirements.txt
          else
            echo "No runtime dependencies declared - nothing to audit."
          fi

      # ── Unit validation ────────────────────────────────────────────────────
      - name: Validate security controls
        run: python tests/run_tests.py -v

      # ── Scanner stage ──────────────────────────────────────────────────────
      # The scanners are installed as pinned, SHA-256-verified release binaries
      # rather than through third-party actions. Reasons, in order of weight:
      #
      #   * aquasecurity/trivy-action@<pinned> failed during JOB SETUP, before
      #     any step executed, which aborted the whole pipeline.
      #   * gitleaks/gitleaks-action ran but failed, because it needs full git
      #     history that a default shallow checkout does not provide.
      #   * semgrep/semgrep-action is archived (last pushed April 2024) and
      #     requires a SEMGREP_APP_TOKEN this pipeline does not have.
      #
      # Verifying the download against a pinned digest also means the binary is
      # pinned to a known hash, not merely to a version number that upstream can
      # re-cut. The only remaining actions are first-party and SHA-pinned.
      - name: Install scanners (pinned and checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p scanner-output /tmp/scanners

          # ── Trivy v0.75.0 ────────────────────────────────────────────────
          TRIVY_VER=0.75.0
          TRIVY_SHA=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          curl -fsSL --retry 3 -o /tmp/scanners/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA}  /tmp/scanners/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/scanners/trivy.tar.gz -C /tmp/scanners trivy
          install -m 0755 /tmp/scanners/trivy /usr/local/bin/trivy

          # ── Gitleaks v8.30.1 ─────────────────────────────────────────────
          GITLEAKS_VER=8.30.1
          GITLEAKS_SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 3 -o /tmp/scanners/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA}  /tmp/scanners/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/scanners/gitleaks.tar.gz -C /tmp/scanners gitleaks
          install -m 0755 /tmp/scanners/gitleaks /usr/local/bin/gitleaks

          # ── Semgrep from a pinned PyPI release ───────────────────────────
          # The p/python ruleset needs no SEMGREP_APP_TOKEN.
          pip install "semgrep==1.180.0"

          trivy --version
          gitleaks version
          semgrep --version

      # Each scanner writes normalised JSON into scanner-output/. A scanner that
      # fails must fail the job rather than silently producing an empty file,
      # which would look like "no findings" and let a deployment through.
      - name: Secret scan — Gitleaks
        run: |
          set -euo pipefail
          # gitleaks exits 1 when it finds a leak. That is expected: the
          # findings are the input to the gate, not a reason to abandon the run.
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path scanner-output/gitleaks.json \
            --redact \
            --no-banner \
            --exit-code 0 || echo "gitleaks reported findings (expected)"
          if [ ! -s scanner-output/gitleaks.json ]; then
            echo "::error::Gitleaks produced no report; refusing to continue."
            exit 1
          fi
          echo "gitleaks completed with a report present."

      - name: SAST — Semgrep
        run: |
          set -euo pipefail
          # Semgrep also exits non-zero on findings, which is expected here.
          semgrep scan \
            --config p/python \
            --json \
            --output scanner-output/semgrep.json \
            --metrics=off \
            --error \
            . || echo "semgrep reported findings (expected)"
          if [ ! -s scanner-output/semgrep.json ]; then
            echo "::error::Semgrep produced no report; refusing to continue."
            exit 1
          fi
          echo "semgrep completed with a report present."

      - name: SCA — Trivy
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --format json \
            --output scanner-output/trivy.json \
            --exit-code 0 \
            .
          if [ ! -s scanner-output/trivy.json ]; then
            echo "::error::Trivy produced no report; refusing to continue."
            exit 1
          fi
          echo "trivy completed with a report present."

      - name: Normalise scanner output
        run: |
          set -euo pipefail
          # --allow-empty is correct here. A missing or unparseable report is
          # already a hard error inside merge_scanners.py, so "the file exists
          # and parsed" is what proves the scanner ran. Zero findings then means
          # a clean repository, which is a legitimate pass, not a failure.
          python tools/merge_scanners.py --allow-empty

      # ── VerifierGate stages ────────────────────────────────────────────────
      - name: Build artifact
        run: |
          set -euo pipefail
          mkdir -p scanner-output
          tar --create --file app.tar \
              --exclude='./runs' \
              --exclude='./.git' \
              --exclude='./app.tar' \
              .
          echo "app.tar created: $(stat -c%s app.tar) bytes"

      - name: Generate provenance attestation
        run: |
          set -euo pipefail
          python tools/make_provenance.py \
            --artifact app.tar \
            --out provenance.json \
            --source "$(git rev-parse HEAD)" \
            --builder "${GITHUB_ACTOR:-local}" \
            --print-source-digest | tee provenance.log | tail -n1 > expected_source_digest.txt
          echo "Expected source digest: $(cat expected_source_digest.txt)"

      # Each gate stage is a separate step so a failure names the stage that
      # broke in the Actions UI, instead of one opaque "security gate failed".
      - name: gate.py score
        run: |
          set -euo pipefail
          python gate.py score \
            --findings scanner-output/merged_findings.json \
            --out scored_findings.json

      - name: gate.py check
        run: |
          set -euo pipefail
          python gate.py check \
            --findings scored_findings.json \
            --policy policy.json \
            --ledger ledger.jsonl

      - name: gate.py verify
        run: |
          set -euo pipefail
          python gate.py verify \
            --artifact app.tar \
            --provenance provenance.json \
            --source-digest "$(cat expected_source_digest.txt)" \
            --freshness 3600 \
            --ledger ledger.jsonl

      - name: Verify audit ledger integrity
        run: python gate.py ledger ledger.jsonl --describe

      # ── Simulation ─────────────────────────────────────────────────────────
      - name: Run simulated scenarios
        run: python pipeline_sim.py

      # ── Evidence ───────────────────────────────────────────────────────────
      - name: Upload audit ledger
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: verifergate-audit-ledger
          path: ledger.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: verifergate-reports
          path: |
            scored_findings.json
            scanner-output/
            runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if the ledger was tampered with
        run: python gate.py ledger ledger.jsonl