# VerifierGate — centralised deployment security gate.
#
# Design notes:
#   * `permissions` is scoped to read-only contents. Nothing in this pipeline
#     needs write access, so no write scope is granted at all.
#   * Third-party actions are pinned to a full commit SHA, not a tag. A mutable
#     tag such as `@v4` can be repointed at new code by anyone who compromises
#     the upstream repository; a SHA cannot.
#   * `persist-credentials: false` stops the checkout token from being written
#     into .git/config where a later step could exfiltrate it.
#   * gate.py exits 2 to block a deployment, which fails this job by design.

name: VerifierGate Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a stale push cannot report success.
concurrency:
  group: verifergate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-gate:
    name: Correlate, policy check, verify provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      # VerifierGate is standard-library only, so there is nothing to install.
      # The install step is kept as a dependency audit rather than a setup step.
      - name: Audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Pinned: an unpinned audit tool is itself an unpinned supply-chain
          # dependency in the job that is supposed to be checking for those.
          pip install "pip-audit==2.10.1"

          # No third-party runtime dependencies are declared, so there is
          # nothing to audit until requirements.txt gains a real entry.
          if grep -qE '^[[:space:]]*[^#[:space:]]' requirements.txt; then
            pip-audit -r requirements.txt
          else
            echo "No runtime dependencies declared - nothing to audit."
          fi

      # ── Unit validation ────────────────────────────────────────────────────
      - name: Validate security controls
        run: python tests/run_tests.py -v

      # ── Scanner stage ──────────────────────────────────────────────────────
      # Each scanner writes normalised JSON into scanner-output/. A scanner that
      # fails must fail the job rather than silently producing an empty file,
      # which would look like "no findings" and let a deployment through.
      - name: Secret scan — Gitleaks
        uses: gitleaks/gitleaks-action@e6dab246340401bf53eec993b8f05aebe80ac636 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Semgrep is installed from a pinned PyPI release rather than via
      # semgrep/semgrep-action, which is archived (last pushed April 2024) and
      # requires a SEMGREP_APP_TOKEN. An archived action pinned in a security
      # pipeline is a liability: it receives no fixes and cannot be trusted to
      # keep behaving. The p/python ruleset needs no token.
      - name: SAST — Semgrep
        run: |
          set -euo pipefail
          pip install "semgrep==1.180.0"
          mkdir -p scanner-output
          # Semgrep exits non-zero when it finds issues, which is expected here:
          # the findings are the point, and gate.py decides whether they block.
          semgrep scan \
            --config p/python \
            --json \
            --output scanner-output/semgrep.json \
            --metrics=off \
            --error \
            . || SEMGREP_RC=$?
          if [ ! -s scanner-output/semgrep.json ]; then
            echo "::error::Semgrep produced no report; refusing to continue."
            exit 1
          fi
          echo "Semgrep completed (exit ${SEMGREP_RC:-0}) with a report present."

      - name: SCA — Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: json
          output: scanner-output/trivy.json

      - name: Normalise scanner output
        run: |
          set -euo pipefail
          # --allow-empty is correct here. A missing or unparseable report is
          # already a hard error inside merge_scanners.py, so "the file exists
          # and parsed" is what proves the scanner ran. Zero findings then means
          # a clean repository, which is a legitimate pass, not a failure.
          python tools/merge_scanners.py --allow-empty

      # ── VerifierGate stages ────────────────────────────────────────────────
      - name: Build artifact
        run: |
          set -euo pipefail
          mkdir -p scanner-output
          tar --create --file app.tar \
              --exclude='./runs' \
              --exclude='./.git' \
              --exclude='./app.tar' \
              .
          echo "app.tar created: $(stat -c%s app.tar) bytes"

      - name: Generate provenance attestation
        run: |
          set -euo pipefail
          python tools/make_provenance.py \
            --artifact app.tar \
            --out provenance.json \
            --source "$(git rev-parse HEAD)" \
            --builder "${GITHUB_ACTOR:-local}" \
            --print-source-digest | tee provenance.log | tail -n1 > expected_source_digest.txt
          echo "Expected source digest: $(cat expected_source_digest.txt)"

      # Each gate stage is a separate step so a failure names the stage that
      # broke in the Actions UI, instead of one opaque "security gate failed".
      - name: gate.py score
        run: |
          set -euo pipefail
          python gate.py score \
            --findings scanner-output/merged_findings.json \
            --out scored_findings.json

      - name: gate.py check
        run: |
          set -euo pipefail
          python gate.py check \
            --findings scored_findings.json \
            --policy policy.json \
            --ledger ledger.jsonl

      - name: gate.py verify
        run: |
          set -euo pipefail
          python gate.py verify \
            --artifact app.tar \
            --provenance provenance.json \
            --source-digest "$(cat expected_source_digest.txt)" \
            --freshness 3600 \
            --ledger ledger.jsonl

      - name: Verify audit ledger integrity
        run: python gate.py ledger ledger.jsonl --describe

      # ── Simulation ─────────────────────────────────────────────────────────
      - name: Run simulated scenarios
        run: python pipeline_sim.py

      # ── Evidence ───────────────────────────────────────────────────────────
      - name: Upload audit ledger
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: verifergate-audit-ledger
          path: ledger.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: verifergate-reports
          path: |
            scored_findings.json
            scanner-output/
            runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if the ledger was tampered with
        run: python gate.py ledger ledger.jsonl